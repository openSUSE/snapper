name: CI Fedora

on: [push, pull_request]

jobs:
  Tests:
    runs-on: ubuntu-latest
    container: fedora

    steps:

    - name: Install additional packages
      run: dnf -y install acl autoconf automake awk boost-devel btrfs-progs-devel dbus-devel diffutils docbook-style-xsl gcc-c++ gettext glibc-langpack-de glibc-langpack-fr glibc-langpack-en json-c-devel libacl-devel libmount-devel libtool libxml2-devel libxslt make ncurses-devel pam-devel xz "pkgconfig(libcrypto)"

    - name: List installed packages
      run: rpm -qa | sort

    - name: Git checkout
      uses: actions/checkout@v6

    - name: Configure
      run: make -f Makefile.repo

    - name: Compile
      run: make -j 2

    - name: Install
      run: make install

    - name: Run unit tests
      run: make -j 2 check VERBOSE=1

    - name: Make package
      run: make package

  Reduced-build:
    # Guard the feature-reduced build configurations that the default job does
    # not exercise. Regression test for a --disable-rollback link failure.
    runs-on: ubuntu-latest
    container: fedora

    steps:

    - name: Install additional packages
      run: dnf -y install acl autoconf automake awk boost-devel btrfs-progs-devel dbus-devel diffutils docbook-style-xsl gcc-c++ gettext glibc-langpack-de glibc-langpack-fr glibc-langpack-en json-c-devel libacl-devel libmount-devel libtool libxml2-devel libxslt make ncurses-devel pam-devel xz

    - name: Git checkout
      uses: actions/checkout@v6

    - name: Bootstrap
      run: make -f Makefile.repo

    - name: Compile with rollback disabled
      run: ./configure --disable-rollback && make -j 2
